metadata:
  name: Seven Governors Core Correspondences
  file: governors.yaml
  description: >-
    Machine-readable core governor correspondences for the Seven Governors framework.
    Three-tier architecture: archetype (immutable identity), canonical expression (diatonic pure state),
    and zodiacal systems (semantic interpretation lens persisting through mode change).
    Use CONSTITUTION.md as the human-readable source of canon and this file as structured reference data.
  hierarchy:
    '12': articulated field / zodiacal practical systems / chromatic totality
    '7': governors / governing functions / diatonic law
    '5': elemental-quintessential engine
    '2': 'luminary bracket: Sun = reality, Moon = experience'
    '1': witnessing center / self / navigator
  extension_schemas:
    vector_b_physics: schemas/vector_b_physics.yaml
    physical_phenomena: schemas/physical_phenomena.yaml
    color_palettes: schemas/color_palettes.yaml
    zodiacal_systems: schemas/zodiacal_systems.yaml
    unified_process_ontology: UNIFIED_PROCESS_ONTOLOGY.md
    visual_recipes: schemas/governors.yaml#governors.*.canonical_expression.visual_recipes
  guardrails:
  - Treat constructive +5 as build orientation and observational +7 as proposed readback orientation.
  - Use CONSTITUTION.md as canonical authority if this schema conflicts with prose documentation.
  bit_order_policy:
    policy_version: 1
    binary_12bit_role: constructive_semitone_order_canonical_string
    binary_12bit_alias_for: binary_constructive
    constructive_orientation: semitone_index_0_to_11
    observational_orientation: reverse_of_constructive_readback
    integer_parse_policy: parse_binary_string_as_written_msb_integer
    legacy_hex_policy: legacy_hex_fields_match_observational_readback_when_present
    binary_string_policy: all_binary_fields_must_be_quoted_strings
    canonical_bit_weight: 7
    variant_bit_weight_policy: validate_declared_weight_only
  constructive_engine:
    mod_12_step: 5
  observational_engine:
    mod_12_step: 7
