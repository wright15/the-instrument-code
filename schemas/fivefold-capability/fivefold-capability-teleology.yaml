guards:
  - guard_id: governor_court_teleology_non_equivalence
    status: enforced
    statement: Governor State, Court Capability, and authored Teleology are non-equivalent namespaces.
  - guard_id: zodiac_no_court_write
    status: enforced
    statement: No zodiac facet, school, affinity, or win condition writes court.poleDisposition, graph state, runtime policy, or ledger success.
  - guard_id: mercury_not_fifth_bit
    status: enforced
    statement: Mercury/Quintessence has is_binary_court_pole false, court_pole_index null, and never enters poleOrder.
  - guard_id: complement_relation_inactive
    status: enforced
    statement: The complement map remains frozen and unclaimed; no active complement relation is declared.
  - guard_id: subset_of_7_35_detached
    status: enforced
    statement: SUBSET_OF_7_35 remains detached audit-only planning evidence; no active subset-incidence relation is declared.
  - guard_id: crt310_untouched
    status: enforced
    statement: CRT-310 files, gates, backlog status, and admission workflow remain unchanged.
  - guard_id: physical_quantity_claim_false
    status: enforced
    statement: Electric/Magnetic/Photonic labels are authored semantic correspondences, not physical quantity claims.
  - guard_id: ch_unresolved_preserved
    status: enforced
    statement: Global harmonic.C_H remains unresolved; scoped sidecars are read-only and cannot write it.
  - guard_id: win_conditions_authored_only
    status: enforced
    statement: Win conditions are authored teleology with no enforcement, policy, transition, controller, or ledger-success behavior.
  - guard_id: excluded_relation_vocabulary_absent
    status: enforced
    statement: SETS_COURT_POLE, EXECUTES_COURT_MOVE, and equivalent executable relations never appear.
