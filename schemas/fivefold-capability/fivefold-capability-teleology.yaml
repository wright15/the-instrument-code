# Fivefold Capability Teleology — CRT-347 authored registry source
#
# Status: planning_evidence. This registry has no runtime, graph, policy,
# ledger, admission, or physical effect. It records the authored
# State/Capability/Teleology separation of the Seven Governors framework:
#
#   topology.ScaleState          -> State / Representation (Governor graph)
#   court.state                  -> Capability Disposition (Pentatonic Court)
#   fivefold.capability_school   -> semantic school namespace (authored)
#   fivefold.teleology.win_condition -> authored goal namespace (authored)
#
# The generator (scripts/build-fivefold-capability-teleology.py) verifies
# every foreign key and replayed value against the bound source authorities
# before emitting canonical/fivefold-capability-candidates/.
#
# Canonical Governor rendering contract remains unchanged:
#   Render_G(g', e_G) = IntrinsicNormalForm(g') (+) Delta_S(e_G)

metadata:
  registry_id: fivefold-capability-teleology
  candidate_id: fivefold-capability-teleology-v1
  version: 1.0.0
  schema_version: crt-347.fivefold-capability-teleology.v1
  story_id: CRT-347
  follow_on_story_id: CRT-348
  admission_status: planning_evidence
  authority: root_owned_non_admitted_planning_evidence_sidecar
  description: >-
    Deterministic planning evidence for the Fivefold Capability Teleology
    design: five capability schools over the four-pole Pentatonic Court,
    a twelve-facet zodiac partition, and authored win conditions, all
    separated from Governor State identity.

admission_boundary:
  runtime_effect: false
  graph_effect: false
  policy_effect: false
  ledger_effect: false
  admission_effect: false
  neo4j_authority: false
  crt310_gate_effect: false
  physical_quantity_claim: false

separation_contract:
  topology_scale_state:
    namespace: topology.ScaleState
    role: state_representation
    statement: Governor graph ontology; what state the system is in.
  court_state:
    namespace: court.state
    role: capability_disposition
    statement: Pentatonic Court affordance and control; how the four poles are disposed.
  capability_school:
    namespace: fivefold.capability_school
    role: semantic_school_namespace
    statement: Authored school identities; never the unqualified runtime term 'capability'.
  teleology_win_condition:
    namespace: fivefold.teleology.win_condition
    role: authored_goal_namespace
    statement: Authored teleology; what outcome an authored school aims at.
  non_equivalence:
    - topology.ScaleState
    - court.state
    - fivefold.capability_school
    - fivefold.teleology.win_condition
    - gov-210.skill.capability
    - court.runtime.requiredCapabilities
  semantic_field_writes_court_register: false
  governor_rendering_contract:
    canonical: "Render(s, e) = IntrinsicNormalForm(s) ⊕ Δ_S(e)"
    contextual_model_only: >-
      ContextualRender(g', e_G, c, w) is a planning model; it is not a
      runtime contract, composite transition, or admission claim.
  relation_vocabulary:
    allowed:
      - AFFORDS
      - AMPLIFIES
      - CONSTRAINS
      - OPPOSES
      - CORRESPONDS_TO
    excluded:
      - SETS_COURT_POLE
      - EXECUTES_COURT_MOVE

compression_coordinate_contract:
  C_P:
    access: read_only
    source: IntrinsicNormalForm photonic convention
    writable_by_this_registry: false
  C_H:
    status: unresolved
    value: null
    scoped_authorities:
      - gov-213.A0-A2.Q_W_A012
      - gov-227.D1-D7.q_v2_Q_W_D17
    writable_by_this_registry: false
    rule: >-
      Global harmonic.C_H remains unresolved. Scoped sidecars are read-only
      inputs and cannot write global harmonic.C_H.
  C_S:
    access: shade_only
    source: immediately_traversed_edge
    rule: Semantic operators may shade rendering; never state identity.
  kappa_court:
    access: read_only_replay
    rule: "kappa(C_i) = i/4; not C_P, C_H, C_S, temperature, entropy, enthalpy, or free energy."
    forbidden_equivalences:
      - physical.C_P
      - harmonic.C_H
      - semantic.C_S
      - physical.temperature
      - physical.entropy
      - physical.enthalpy
      - physical.freeEnergy

physical_claim_contract:
  physical_quantity_claim: false
  polarity_labels:
    electric:
      correspondence: External Court pole disposition
      status: authored_semantic_correspondence
    magnetic:
      correspondence: Internal Court pole disposition
      status: authored_semantic_correspondence
    photonic:
      correspondence: Sun/Moon system-level bracket facet
      status: authored_semantic_correspondence
  no_si_units: true
  no_electromagnetic_equivalence: true
  no_energy_equations: true
  no_physical_causation: true

