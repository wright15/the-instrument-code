      value: periodic_flooding_and_evaporation
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: dry_lake
      definition: "A former or intermittently occupied lake basin exposed when evaporation and water loss exceed incoming supply."
      relation_type: formed_by
      value: evaporation_and_water_loss_exceeding_inflow
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: chott
      definition: "A North African saline depression that undergoes intermittent flooding followed by strong evaporative concentration."
      relation_type: formed_by
      value: intermittent_flooding_and_evaporative_concentration
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: salar
      definition: "An extensive salt-encrusted basin produced by evaporation of mineral-rich water in a closed, commonly high-altitude drainage system."
      relation_type: formed_by
      value: closed_basin_evaporation_of_mineral_rich_water
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: sabkha
      definition: "A coastal or inland evaporitic flat shaped by intense evaporation, shallow groundwater, and repeated salt precipitation (cross: Moon or Mercury)."
      relation_type: formed_by
      value: intense_evaporation_shallow_groundwater_and_salt_precipitation
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: gypsum_crust
      definition: "A hardened surface layer formed when evaporating groundwater or surface water precipitates gypsum."
      relation_type: formed_by
      value: evaporative_gypsum_precipitation
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: gypcrete
      definition: "A gypsum-cemented soil or sediment horizon produced by evaporative concentration and precipitation in arid environments."
      relation_type: formed_by
      value: evaporative_gypsum_concentration_and_precipitation
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: calcrete
      definition: "A hardened carbonate-rich soil or sediment layer formed when evaporation and groundwater movement concentrate and precipitate calcium carbonate."
      relation_type: formed_by
      value: evaporative_groundwater_calcium_carbonate_precipitation
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: desert_pavement
      definition: "A tightly packed surface of stones produced by combinations of wind deflation, runoff, soil development, and surface accumulation under arid conditions, rather than by sunlight alone (cross: Jupiter)."
      relation_type: formed_by
      value: polygenetic_arid_surface_processes
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: suncup
      definition: "A shallow, bowl-shaped depression in snow or ice produced by uneven solar heating and melt."
      relation_type: formed_by
      value: differential_solar_heating_and_melt
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: penitente
      definition: "A narrow blade or spike of snow or ice formed when intense sunlight drives differential melting and sublimation."
      relation_type: formed_by
      value: solar_driven_differential_melting_and_sublimation
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: cryoconite_hole
      definition: "A cylindrical depression melted into glacier ice when dark sediment absorbs solar radiation more effectively than the surrounding surface."
      relation_type: formed_by
      value: solar_absorption_by_dark_sediment
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact

