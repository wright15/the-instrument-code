tier: A0
domain: landform

sun:
  process_family: insolation_and_thermal
  entities:
    - entity_id: bornhardt
      definition: "A large, steep-sided bedrock dome formed through differential weathering and erosion, with solar heating and thermal exfoliation often modifying its exposed surface."
      relation_type: formed_by
      value: differential_weathering_erosion_and_thermal_exfoliation
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: exfoliation_dome
      definition: "A rounded rock outcrop shaped by successive detachment of curved rock sheets through thermal stress, unloading, or both."
      relation_type: formed_by
      value: thermal_stress_and_pressure_release
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: granite_dome
      definition: "A rounded granite prominence shaped by joint-controlled erosion, pressure release, and, in some settings, solar-driven thermal exfoliation."
      relation_type: formed_by
      value: joint_controlled_erosion_pressure_release_and_thermal_exfoliation
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: exfoliation_sheet
      definition: "A curved slab detached from exposed bedrock by surface-parallel cracking generated through thermal stress or pressure release."
      relation_type: formed_by
      value: thermal_stress_or_pressure_release
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: exfoliation_scarp
      definition: "A steep rock face exposed when thermal expansion, unloading, or both cause an outer bedrock sheet to separate."
      relation_type: formed_by
      value: thermal_expansion_and_unloading
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: sheet_joint
      definition: "A curved, near-surface fracture formed parallel to exposed bedrock through unloading and, in some cases, repeated thermal stressing."
      relation_type: formed_by
      value: unloading_and_repeated_thermal_stressing
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: thermal_stress_fracture
      definition: "A crack in exposed rock generated when uneven heating and cooling create differential expansion and contraction."
      relation_type: formed_by
      value: differential_thermal_expansion_and_contraction
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: thermal_fatigue_crack
      definition: "A progressively enlarging rock fracture produced by repeated daily or seasonal heating and cooling cycles."
      relation_type: formed_by
      value: repeated_thermal_cycling
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: insolation_weathered_rock_surface
      definition: "An exposed bedrock surface physically weakened by repeated expansion and contraction under direct solar radiation."
      relation_type: formed_by
      value: solar_radiation_driven_thermal_expansion_and_contraction
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: thermal_spall
      definition: "A detached rock fragment produced when rapid or uneven heating causes near-surface bedrock to fracture."
      relation_type: formed_by
      value: rapid_or_uneven_heating
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: tafoni
      definition: "Cavities in exposed rock enlarged by salt crystallization, moisture cycling, chemical weathering, and sometimes thermal stress."
      relation_type: formed_by
      value: salt_crystallization_moisture_cycling_and_thermal_stress
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: honeycomb_weathering_cavity
      definition: "A small, closely spaced rock hollow created mainly by evaporative salt crystallization and repeated wetting and drying."
      relation_type: formed_by
      value: evaporative_salt_crystallization_and_wet_dry_cycling
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: panhole
      definition: "A shallow rock basin enlarged by standing water, chemical weathering, evaporation, and alternating wet-dry conditions (cross: Mercury)."
      relation_type: formed_by
      value: standing_water_weathering_evaporation_and_wet_dry_cycling
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: gnamma
      definition: "A water-holding depression in exposed bedrock formed through localized weathering, dissolution, and repeated drying (cross: Mercury)."
      relation_type: formed_by
      value: localized_weathering_dissolution_and_repeated_drying
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: desiccation_crack
      definition: "A fracture in drying sediment produced when solar heating and evaporation cause the surface to contract."
      relation_type: formed_by
      value: solar_heating_evaporation_and_sediment_contraction
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: desiccation_polygon
      definition: "A polygonal surface pattern created when evaporative drying produces interconnected shrinkage cracks in fine-grained sediment."
      relation_type: formed_by
      value: evaporative_drying_and_sediment_shrinkage
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: mud_crack_network
      definition: "An interconnected pattern of fractures formed when exposed, water-rich mud dries and contracts."
      relation_type: formed_by
      value: mud_drying_and_contraction
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: evaporite_crust
      definition: "A mineral-rich surface layer formed when evaporation concentrates dissolved salts until they crystallize."
      relation_type: formed_by
      value: evaporative_salt_concentration_and_crystallization
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: salt_flat
      definition: "A broad, level surface covered by evaporite minerals deposited when water repeatedly evaporates from a closed basin."
      relation_type: formed_by
      value: closed_basin_evaporation_and_evaporite_deposition
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: salt_pan
      definition: "A shallow, commonly flat depression coated with salts concentrated through intense evaporation."
      relation_type: formed_by
      value: intense_evaporation_and_salt_concentration
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: salt_polygon
      definition: "A polygonal pattern on a salt flat produced by cycles of evaporation, salt crystallization, expansion, and contraction."
      relation_type: formed_by
      value: evaporation_salt_crystallization_expansion_and_contraction
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: salt_ridge_polygon
      definition: "A raised polygonal boundary on an evaporite flat formed when expanding or recrystallizing salts buckle the surface."
      relation_type: formed_by
      value: salt_expansion_or_recrystallization
      governor: sun
      canonicality: primary
      source_class: empirical_domain_fact
    - entity_id: playa
      definition: "A low-lying basin floor that periodically floods and subsequently dries through evaporation."
