# Semantic Operator Registry v1.0.1
# Status: Proposed canonization.
# Layer: 4 (Semantic translation dictionary).
# Canonical rendering definition:
#   Render(s, e) = IntrinsicNormalForm(s) ⊕ Δ_S(e)
#
# This registry does not compute or duplicate structural masks. Layer 3 resolves
# and validates the algebraic transition before Layer 4 is invoked.

metadata:
  registry_id: "semantic_operator_registry"
  version: "1.0.1"
  status: "admitted"
  author: "Solomon"
  layer: 4
  description: >-
    Translation dictionary mapping the 15 algebraic mutation operators to
    Chaldean degree addresses, single-edge semantic overlays, typed physical
    processes, symbolic physical anchors, and domain-projection deltas.
  architecture:
    operators_are: "verbs"
    intrinsic_identity: "state"
    contextual_identity: "state_plus_immediately_traversed_edge"
    canonical_rendering_definition: "Render(s, e) = IntrinsicNormalForm(s) ⊕ Δ_S(e)"

dependencies:
  algebraic_release:
    package: "seven-governors-mutation-algebra-audit"
    version: "1.0.0"
    release_id: "mutation-algebra-audit:1.0.0"
    relationship: "foreign_key_authority"

structural_enforcement:
  authority: "upstream"
  enforced_by:
    - "seven-governors-mutation-algebra-audit/audit/operator-applications.csv"
    - "seven-governors-mutation-algebra-audit/neo4j/algebra-validation.cypher"
  validates:
    - "XOR masks"
    - "source and target bit eligibility"
    - "Hamming distances"
    - "cardinality preservation"
    - "partial inverse laws"
    - "commutation laws"
    - "modal covariance"
    - "Governor-label transport"
  registry_contract: >-
    This semantic registry references algebraic operator IDs. It does not
    duplicate, recompute, or override masks, bit transitions, Hamming distances,
    inverse domains, commutation tables, or topology-derived state identity.

compression_coordinate_contract:
  C_P:
    name: "Photonic Compression"
    source: "IntrinsicNormalForm"
    overlay_access: "read_only"
    rule: >-
      Physical-process anchors may annotate rendering, but Layer 4 does not
      recompute or overwrite the intrinsic C_P coordinate.
  C_H:
    name: "Harmonic Compression"
    source: "IntrinsicNormalForm"
    overlay_access: "read_only"
    rule: >-
      C_H is compiled upstream from the resolved state. Semantic operators may
      consume it as context but may not derive, modify, or replace it.
  C_S:
    name: "Semantic Compression"
    source: "immediately_traversed_edge"
    overlay_access: "shade_only"
    rule: >-
      The active operator contributes Δ_S(e) as a non-mutating rendering
      overlay over the destination state's Intrinsic Normal Form.

route_context:
  context_id: "Virgo_Ledger"
  scope: "immediately_traversed_edge"
  accumulation: "none"
  overlay_cardinality: 1
  replacement_rule: >-
    Each successful traversal replaces the previous active route overlay for
    rendering purposes. Historical edges may remain in the ledger as
    provenance, but they are not folded into the active semantic overlay.
  identity_effect: "none"
  render_effect: "shade_destination_intrinsic_normal_form"
  confluence_rule: >-
    IntrinsicNormalForm(state) is route-independent and categorical. Route
    Context may alter rendered emphasis but never state identity.

immutability_guard:
  overlays_may_not_overwrite: [Governor_office, anchor_tier, C_H, bitmask]
  violation_policy: "reject_overlay_and_emit_validation_error"

physical_process_contract:
  execution_mode: "symbolic_only"
  equation_field: "symbolic_anchor"
  rule: >-
    Symbolic anchors describe the physical analogy used by the semantic
    renderer. They are not numerically evaluated in v1.0.1.

operator_binding_map:
  R1: "saturn_degree_raise_v1"
  L1: "saturn_degree_lower_v1"
  R2: "jupiter_degree_raise_v1"
  L2: "jupiter_degree_lower_v1"
  R3: "mars_degree_raise_v1"
  L3: "mars_degree_lower_v1"
  R4: "sun_degree_raise_v1"
  L4: "sun_degree_lower_v1"
  R5: "venus_degree_raise_v1"
  L5: "venus_degree_lower_v1"
  R6: "mercury_degree_raise_v1"
  L6: "mercury_degree_lower_v1"
  R7: "moon_degree_raise_v1"
  L7: "moon_degree_lower_v1"
  M: "modal_shift_v1"

operators:
  # ==========================================================
  # CHALDEAN ADDRESS 1: SATURN
  # Boundary / Initiation / Fixation
  # ==========================================================
  - operator_id: "saturn_degree_raise_v1"
    algebraic_operator_ref:
      release_id: "mutation-algebra-audit:1.0.0"
      operator_id: "R1"
      domain_ref: "seven-governors-mutation-algebra-audit/audit/operator-applications.csv#operator_id=R1"
      inverse_ref: "seven-governors-mutation-algebra-audit/audit/inverse-witnesses.csv#operator_id=R1&inverse_operator_id=L1"
    degree_governor: "Saturn"
    degree_number: 1
    direction: "raise"
    physical_process:
      name: "Crystallization / Lattice Formation"
      physical_domain: [solid_state_physics, optics]
      symbolic_anchor: "nλ = 2d sin(θ) (Bragg's Law for diffraction boundary)"
    semantic_delta:
      promotes: [rigid_fixation, hard_crystallization, impenetrable_boundary]
      suppresses: [fluidity, tonic_root_stability, openness]
      domain_projection_delta:
        terrain:
          action: "Flash-freeze or petrify; create jagged, immovable structures."
          examples:
            - "magma field turning to obsidian glass"
            - "mud turning to sharp shale"
    preserves: [intrinsic_normal_form, degree_address_assignments]

  - operator_id: "saturn_degree_lower_v1"
    algebraic_operator_ref:
      release_id: "mutation-algebra-audit:1.0.0"
      operator_id: "L1"
      domain_ref: "seven-governors-mutation-algebra-audit/audit/operator-applications.csv#operator_id=L1"
      inverse_ref: "seven-governors-mutation-algebra-audit/audit/inverse-witnesses.csv#operator_id=L1&inverse_operator_id=R1"
    degree_governor: "Saturn"
    degree_number: 1
    direction: "lower"
    physical_process:
      name: "Subduction / Entropic Collapse"
      physical_domain: [geophysics, thermodynamics]
      symbolic_anchor: "ΔS ≥ 0 (Second Law of Thermodynamics for boundary dissolution)"
    semantic_delta:
      promotes: [boundary_dissolution, subterranean_descent, entropy]
      suppresses: [fixation, surface_structure]
      domain_projection_delta:
        terrain:
          action: "Undermine foundations; create sinkholes or subterranean voids."
          examples:
            - "solid ground collapsing into a sinkhole"
            - "mountain base eroding into a cave system"
    preserves: [intrinsic_normal_form, degree_address_assignments]

  # ==========================================================
  # CHALDEAN ADDRESS 2: JUPITER
