      physical_domain: [optics, fluid_dynamics]
      symbolic_anchor: "I ∝ 1/λ^4 (Rayleigh scattering intensity)"
    semantic_delta:
      promotes: [updraft, high_altitude_distribution, rarefied_flow]
      suppresses: [ground_level_drag]
      domain_projection_delta:
