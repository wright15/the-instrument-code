    degree_governor: null
    degree_number: null
    direction: "rotate"
    structural_effect_summary: >-
      Preserves unrooted pitch-class content and Forte family while transporting
      the tonic axis, State Governor, and Degree-Governor addresses. The upstream
      algebra enforces M^7 = I and +2 Governor-label transport modulo 7.
    physical_process:
      name: "Gravitational Recentering"
      physical_domain: [coordinate_geometry]
      symbolic_anchor: "N/A — axis transport, not a scalar physical equation"
    semantic_delta:
      promotes: [perspective_shift, gravitational_recentering]
      suppresses: [previous_tonic_axis]
      domain_projection_delta:
        environment:
          action: >-
            Shift the center of gravity of the environment. Its intrinsic form
            remains unchanged, while salience and perspective are recentered.
    preserves: [unrooted_pitch_class_content, forte_family]
    transports: [tonic_axis, State_Governor, Degree_Governor_addresses]
