# Mechanics Thermodynamics Registry v2.0.0
#
# Status: Proposed planning evidence. No runtime, graph, policy, ledger,
# admission, or physics effect.
#
# v2 moves rich thermodynamic glossary entries directly into each capability
# array. The four-part scaffold remains encoded by relation_type:
# characterizes, transforms, structures, and transfers.
#
# Water/Venus Low-Enthalpy, Earth/Saturn Low-Entropy, and
# Quintessence/Mercury Equilibrium entries are Electric/External only.
# Low-Entropy markers describe local ordering sustained by external work or
# entropy export, never a second-law exception. Mercury remains excluded from
# the binary Court register; its Electric/External channel is an authored
# outward-facing capability path, not a Court polarity bit. This semantic
# placement does not claim electric and magnetic fields are physically separate.

