invariants:
  - invariant_id: single_class_5_35
    statement: All five bound masks are members of Forte 5-35 with prime form (0,2,4,7,9), interval vector <0,3,2,1,4,0>, anhemitonic, CQ=1, SQ=1/2.
  - invariant_id: court_position_replay
    statement: The five pitch masks are exactly the admitted C0-C4 masks from court-runtime-policy.json, in canonical order.
  - invariant_id: brightness_kappa_monotonic
    statement: Leonard brightness 22,23,24,25,26 tracks kappa_court 0,1/4,1/2,3/4,1 monotonically along C0-C4.
  - invariant_id: complement_pairs_replay
    statement: Each mask's raw 12-bit complement equals the frozen complement-map rooted pair for its Court position; the pairing is frozen evidence, not an active graph relation.
  - invariant_id: orientation_policy
    statement: mask strings are MSB documentation; pitch_mask integers are LSB parses; ordinary MSB parsing of the string is forbidden.
  - invariant_id: emblem_not_register
    statement: Element assignments are authored emblems; Mercury stays excluded from the register; no record writes court.poleDisposition.

guards:
  - guard_id: physics_authored_correspondence
    status: enforced
    statement: Electromagnetic labels are authored correspondence; physical_quantity_claim is false and no EM equivalence is asserted.
  - guard_id: mercury_excluded_from_register
    status: enforced
    statement: Quintessence carries is_binary_court_pole false, court_pole_index null, and register_membership excluded.
  - guard_id: no_court_writes
    status: enforced
    statement: No binding writes court.poleDisposition, graph state, runtime policy, or ledger success.
  - guard_id: no_unadmitted_classes
    status: enforced
    statement: Every bound mask is admitted class 5-35; no proposed pentatonic class is claimed.
  - guard_id: complement_frozen_not_active
    status: enforced
    statement: Complement pairs are replayed as frozen evidence with relation_admission frozen_evidence_not_active_graph_relation.
  - guard_id: kappa_and_ch_untouched
    status: enforced
    statement: kappa_court is read-only replay; global harmonic.C_H is not written.
  - guard_id: crt310_untouched
    status: enforced
    statement: CRT-310 gates, backlog, and workflow remain unchanged.
  - guard_id: excluded_relation_vocabulary_absent
    status: enforced
    statement: SETS_COURT_POLE, EXECUTES_COURT_MOVE, and equivalent executable relations never appear.
