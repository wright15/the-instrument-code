# Elemental Pentatonic Scale Map v1.0.0
#
# Status: Proposed — planning evidence. No runtime, graph, policy, ledger,
# admission, or physics effect. The map is authored correspondence; the
# underlying masks, classes, and complement pairs are replayed from admitted
# sources without redefinition.
#
# The map finalizes the dual-core topological separation of domain-registry
# physics categorization:
#   Photonic (Governor / Ontological):    7-35 nodes — passive geography,
#     light, and matter (landforms, flora, architecture). Variations are
#     categorized by the 7 Governors; C_P is the photonic coordinate.
#   Electromagnetic (Element / Teleological): 5-35 nodes — active mechanics,
#     force, and capability (kinematics, weather). Variations are categorized
#     by the 4 element axes plus the Mercury engine; Electric (External) and
#     Magnetic (Internal) are authored correspondences, not physical fields.
#
# Orientation policy (replayed from schemas/governors.yaml#bit_order_policy):
# mask strings are written MSB; the pitch_mask integer is the LSB parse
# (bit p = pitch class p). The as-written MSB integer is recorded but never
# used as a pitch mask (ordinaryBinaryParseOfPitchMask12Forbidden).
#
# Ian Ring scale catalog: https://ianring.com/musictheory/scales/<id>

metadata:
  registry_id: elemental_pentatonic_scale_map
  version: 1.0.0
  admission_status: proposed
  physical_quantity_claim: false
  no_electromagnetic_equivalence: true
  description: >-
    Binds the five elemental capability schools to their canonical 5-35
    Ian Ring scale identities (661 Major Pentatonic, 677 Scottish Pentatonic,
    1189 Qing Yu, 1193 Minor Pentatonic, 1321 Man Gong), each replayed from
    the admitted C0-C4 Court register, with authored semantic roles.
  architecture:
    dual_core:
      ontological_layer:
        nodes: 7-35
        physics_category: Photonic
        coordinate: C_P
        content: passive geography, light, and matter
        examples: [landforms, flora, architecture]
        variation_axis: 7 Governors
      teleological_layer:
        nodes: 5-35
        physics_category: Electromagnetic
        coordinate: kappa_court
        content: active mechanics, force, and capability
        examples: [kinematics, weather]
        variation_axis: 4 element axes plus Mercury engine
    emblem_not_register: >-
      A scale mask belongs to its Court position. The element assignment is
      an authored emblem; it never adds a fifth register axis and never
      writes court.poleDisposition.

admission_boundary:
  runtime_effect: false
  graph_effect: false
  policy_effect: false
  ledger_effect: false
  admission_effect: false
  writes_court_pole_disposition: false
  kappa_court_access: read_only_replay
  global_ch_access: no_write
  no_pentatonic_family_admission_claim: true
  crt310_gate_effect: false

orientation_policy:
  mask_string_written_msb: true
  pitch_mask_integer_lsb: true
  ordinary_msb_parse_forbidden: true
  statement: >-
    Each record stores the MSB doc string and the LSB pitch_mask integer.
    Reversal of the string must equal the pitch mask; the as-written parse
    is recorded as documentation only.

scale_bindings:
  - element: Fire (Mars)
    school_ref: fivefold.capability_school.fire
    zodiac_facets: [fivefold.zodiac.capability_school_facet.aries, fivefold.zodiac.capability_school_facet.scorpio]
    ian_ring_id: 661
    ian_ring_name: Major Pentatonic
    ian_ring_url: https://ianring.com/musictheory/scales/661
    mask_string_msb: "101010010100"
    pitch_mask: 661
    as_written_msb_integer: 2708
    pitch_classes: [0, 2, 4, 7, 9]
    prime_form: [0, 2, 4, 7, 9]
    forte_class: 5-35
    interval_structure: [2, 2, 3, 2, 3]
    interval_vector: [0, 3, 2, 1, 4, 0]
    court_position: C0
    kappa_court: {numerator: 0, denominator: 1}
    brightness: 22
    emblem_role: electric_seed
    semantic_fit: >-
      The prime mode: fully open anhemitonic consonance, all four poles
      External. Pure outward activation — the broadcast seed of the
      polarization cycle.
    complement_evidence:
      raw_heptatonic_complement_mask: 3434
      complement_governor: Saturn
      relation_admission: frozen_evidence_not_active_graph_relation
    transition_refs:
      - court_advance_C0_to_C1
      - court_retreat_C1_to_C0

  - element: Air / Wind (Jupiter)
    school_ref: fivefold.capability_school.air
    zodiac_facets: [fivefold.zodiac.capability_school_facet.sagittarius, fivefold.zodiac.capability_school_facet.pisces]
